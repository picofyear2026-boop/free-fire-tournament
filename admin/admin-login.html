<title>Admin Login - Free Fire Tournament</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background: #05000d;
        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow: hidden;
    }

    /* ANIMATED GRID */

    body::before {
        content: "";
        position: fixed;
        inset: 0;

        background-image:
            linear-gradient(
                rgba(0,255,255,0.08) 1px,
                transparent 1px
            ),
            linear-gradient(
                90deg,
                rgba(255,0,255,0.08) 1px,
                transparent 1px
            );

        background-size: 45px 45px;

        animation: gridMove 8s linear infinite;

        pointer-events: none;
        z-index: -3;
    }

    @keyframes gridMove {
        from {
            transform: translateY(0);
        }

        to {
            transform: translateY(45px);
        }
    }

    /* GLOWING LIGHTS */

    .glow-one {
        position: fixed;
        width: 400px;
        height: 400px;

        background: radial-gradient(
            circle,
            rgba(0,255,255,0.18),
            transparent 70%
        );

        top: -150px;
        left: -150px;

        pointer-events: none;
        z-index: -2;
    }

    .glow-two {
        position: fixed;
        width: 450px;
        height: 450px;

        background: radial-gradient(
            circle,
            rgba(255,0,255,0.15),
            transparent 70%
        );

        bottom: -180px;
        right: -150px;

        pointer-events: none;
        z-index: -2;
    }

    /* LOGIN BOX */

    .login-box {
        width: min(420px, 90%);

        padding: 35px;

        background: rgba(8,3,20,0.96);

        border: 1px solid #00ffff;

        border-radius: 20px;

        text-align: center;

        position: relative;
        z-index: 10;

        box-shadow:
            0 0 15px rgba(0,255,255,0.5),
            0 0 40px rgba(255,0,255,0.25),
            inset 0 0 25px rgba(0,255,255,0.05);
    }

    /* LOGO */

    .logo img {
        width: 100px;
        height: 100px;

        object-fit: contain;

        margin-bottom: 15px;

        filter:
            drop-shadow(0 0 8px #00ffff)
            drop-shadow(0 0 18px #ff00ff);
    }

    /* TITLE */

    h1 {
        font-size: 30px;

        color: #00ffff;

        margin-bottom: 8px;

        text-shadow:
            0 0 5px #00ffff,
            0 0 15px #00ffff,
            0 0 30px #ff00ff;
    }

    .subtitle {
        color: #999;

        font-size: 14px;

        margin-bottom: 30px;
    }

    /* INPUT */

    .input-group {
        text-align: left;

        margin-bottom: 20px;
    }

    .input-group label {
        display: block;

        margin-bottom: 8px;

        color: #00ffff;

        font-size: 13px;

        font-weight: bold;
    }

    .input-group input {
        width: 100%;

        padding: 14px;

        background: #080812;

        border: 1px solid #444;

        border-radius: 8px;

        color: white;

        font-size: 15px;

        outline: none;
    }

    .input-group input:focus {
        border-color: #00ffff;

        box-shadow:
            0 0 10px rgba(0,255,255,0.5);
    }

    /* LOGIN BUTTON */

    .login-button {
        width: 100%;

        padding: 14px;

        margin-top: 5px;

        background: transparent;

        border: 1px solid #00ffff;

        border-radius: 8px;

        color: #00ffff;

        font-size: 16px;

        font-weight: bold;

        cursor: pointer;

        box-shadow:
            0 0 10px rgba(0,255,255,0.4);

        transition: 0.3s;
    }

    .login-button:hover {
        background: #00ffff;

        color: #05000d;

        box-shadow:
            0 0 15px #00ffff,
            0 0 35px #00ffff;
    }

    .login-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* MESSAGE */

    #message {
        min-height: 22px;

        margin-top: 15px;

        font-size: 14px;

        font-weight: bold;
    }

    .success {
        color: #00ff99;

        text-shadow:
            0 0 10px #00ff99;
    }

    .error {
        color: #ff3366;

        text-shadow:
            0 0 10px #ff3366;
    }

    /* BACK */

    .back-button {
        display: inline-block;

        margin-top: 20px;

        color: #888;

        text-decoration: none;

        font-size: 13px;
    }

    .back-button:hover {
        color: #ff00ff;

        text-shadow:
            0 0 10px #ff00ff;
    }

    /* SECURITY */

    .security {
        margin-top: 25px;

        color: #555;

        font-size: 11px;
    }

    /* MOBILE */

    @media (max-width: 500px) {

        .login-box {
            padding: 25px;
        }

        h1 {
            font-size: 24px;
        }

        .logo img {
            width: 80px;
            height: 80px;
        }
    }
</style>

<body>

```
<div class="glow-one"></div>
<div class="glow-two"></div>


<div class="login-box">

    <!-- LOGO -->

    <div class="logo">

        <img
            src="/images/tournament-logo.png"
            alt="Tournament Logo"
        >

    </div>


    <!-- TITLE -->

    <h1>ADMIN LOGIN</h1>

    <p class="subtitle">
        Tournament Control Center
    </p>


    <!-- LOGIN FORM -->

    <form id="loginForm">

        <div class="input-group">

            <label for="username">
                ADMIN USERNAME
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter admin username"
                autocomplete="username"
                required
            >

        </div>


        <div class="input-group">

            <label for="password">
                ADMIN PASSWORD
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-button"
            id="loginButton"
        >
            LOGIN TO ADMIN PANEL
        </button>


        <div id="message"></div>

    </form>


    <a
        href="/"
        class="back-button"
    >
        ← Back to Tournament
    </a>


    <div class="security">
        SECURE ADMIN AREA
    </div>

</div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;


            message.textContent = "";
            message.className = "";

            loginButton.disabled = true;
            loginButton.textContent = "CHECKING...";


            try {

                const response = await fetch(
                    "/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const data =
                    await response.json();


                if (
                    response.ok &&
                    data.success
                ) {

                    message.textContent =
                        "LOGIN SUCCESSFUL";

                    message.className =
                        "success";


                    setTimeout(
                        function() {

                            window.location.href =
                                "/admin/admin.html";

                        },
                        500
                    );

                } else {

                    message.textContent =
                        data.message ||
                        "Invalid username or password";

                    message.className =
                        "error";

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "LOGIN TO ADMIN PANEL";
                }

            } catch (error) {

                message.textContent =
                    "Unable to connect to server";

                message.className =
                    "error";

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "LOGIN TO ADMIN PANEL";
            }

        }
    );

</script>
